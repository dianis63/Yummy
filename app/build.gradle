plugins {
    alias(libs.plugins.android.application)
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.21'
}
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
android {
    namespace 'com.yummy.app'
    compileSdk {
        version = release(37) {
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    defaultConfig {
        applicationId "com.yummy.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "SUPABASE_URL", "\"${localProps.getProperty('SUPABASE_URL', '')}\""
        buildConfigField "String", "SUPABASE_KEY", "\"${localProps.getProperty('SUPABASE_KEY', '')}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation platform('io.github.jan-tennert.supabase:bom:3.2.6')
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.ktor:ktor-client-android:3.1.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'io.coil-kt.coil3:coil:3.3.0'
    implementation 'io.coil-kt.coil3:coil-network-ktor3:3.3.0'
    implementation 'io.github.jan-tennert.supabase:storage-kt'
}